# ============================================================
# 砚舟 — Docker Compose 编排
#
# 使用方式：
#   默认启动（仅主服务）:
#     docker compose up -d --build
#
#   启动含 Python agents（可选）:
#     docker compose --profile agents up -d --build
#
#   查看日志:
#     docker compose logs -f
#
#   停止:
#     docker compose down
#
#   停止并删除数据卷（谨慎！）:
#     docker compose down -v
# ============================================================

services:
  # ---- 主服务：Web 前端 + Hono 后端 + SQLite ----
  novelmuse:
    build:
      context: .
      dockerfile: Dockerfile
    image: novelmuse:latest
    container_name: novelmuse
    restart: unless-stopped
    ports:
      - "${PORT:-3774}:3774"
    volumes:
      # SQLite 数据库 + 项目级数据库持久化
      - novelmuse-data:/app/data
    environment:
      # 运行模式
      NODE_ENV: production
      # 服务端口（容器内）
      PORT: 3774
      # 数据库路径
      DB_PATH: /app/data/novelmuse.db
      # 管理员引导账号用户名（仅在系统内还没有任何管理员时生效，默认 admin）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      # 管理员密码（不设置则首次启动自动生成随机强密码并打印到日志）
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # JWT 密钥（生产必填：不设置则容器拒绝启动。生成：openssl rand -hex 32）
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (generate with: openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      # ---- 安全开关（C4/C8/C10）----
      # 会话 Cookie：仅 HTTPS 反向代理场景设为 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 注册开关：容器默认暴露 0.0.0.0，生产默认关闭注册（防任意账号占用 AI 额度）
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # SSRF 防护：如需让用户配置指向局域网内的 AI 服务，设为 true 放开私网地址
      AI_SSRF_ALLOW_PRIVATE: ${AI_SSRF_ALLOW_PRIVATE:-false}
      # ---- AI 配置（也可在应用内 UI 配置，环境变量为全局默认）----
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4-turbo}
      # Ollama 本地模型
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      # Custom 中转站
      CUSTOM_AI_BASE_URL: ${CUSTOM_AI_BASE_URL:-}
      CUSTOM_AI_API_KEY: ${CUSTOM_AI_API_KEY:-}
      CUSTOM_AI_MODEL: ${CUSTOM_AI_MODEL:-}
      # 代理（容器内访问外网）
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      # Python agents 服务地址（启用 agents profile 时生效）
      AGENTS_URL: ${AGENTS_URL:-http://novelmuse-agents:3775}
    # 健康检查（使用 Node.js 内置 fetch，无需 curl/wget）
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3774/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # 优雅关闭：给数据库 flush 的时间
    stop_grace_period: 15s
    stop_signal: SIGTERM
    # Linux 下访问宿主机服务（如本地 Ollama）
    # host.docker.internal 在 Linux 默认不可用，需通过 host-gateway 映射
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - novelmuse-net

  # ---- 可选服务：Python Strands Agents 微服务 ----
  # 默认不启动，需通过 --profile agents 显式启用
  # 启用后提供 /api/ai/gateway 转发的 Python agent 能力
  novelmuse-agents:
    build:
      context: .
      dockerfile: apps/agents/Dockerfile
    image: novelmuse-agents:latest
    container_name: novelmuse-agents
    restart: unless-stopped
    profiles: ["agents"]
    # 不对外暴露端口，仅容器间通信
    expose:
      - "3775"
    environment:
      AGENTS_PORT: 3775
      AGENTS_HOST: 0.0.0.0
      # Python agents 需要独立的 AI 配置（Strands SDK）
      OPENAI_API_KEY: ${AGENTS_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}
      OPENAI_BASE_URL: ${AGENTS_OPENAI_BASE_URL:-${OPENAI_BASE_URL:-https://api.openai.com/v1}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3775/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - novelmuse-net

# 命名卷：数据持久化，由 Docker 管理，不会随容器删除
volumes:
  novelmuse-data:
    name: novelmuse-data

# 内部网络：容器间通信（主服务 → agents）
networks:
  novelmuse-net:
    name: novelmuse-net
    driver: bridge
