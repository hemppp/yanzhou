<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>砚舟 · 框架思维导图</title>
<style>
  :root{
    --paper:#f6f3ed; --paper2:#fffdf9; --ink:#1e2430; --soft:#596374; --faint:#98a2b0;
    --line:#e3ddd1; --shadow:0 1px 2px rgba(30,36,48,.06),0 10px 30px -14px rgba(30,36,48,.22);
    /* 分支色 */
    --c-web:#2f6fb3; --c-server:#3f4fa0; --c-core:#c07a1a; --c-plugins:#2f8a63;
    --c-data:#0e8a8a; --c-desktop:#7b52c9; --c-tools:#6b7280; --c-docs:#a0866a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow:hidden;}

  /* ---------- top bar ---------- */
  .bar{position:absolute;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 20px;background:linear-gradient(180deg,rgba(246,243,237,.96),rgba(246,243,237,.72) 70%,transparent);
    pointer-events:none;}
  .bar > *{pointer-events:auto;}
  .title h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.4px;}
  .title .sub{font-size:12px;color:var(--soft);margin-top:2px;}
  .title .tag{display:inline-block;font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:#b3452f;
    border:1px solid rgba(179,69,47,.35);border-radius:999px;padding:1px 9px;margin-bottom:5px;}
  .search{position:relative;}
  .search input{padding:9px 13px 9px 33px;border:1px solid var(--line);border-radius:10px;background:var(--paper2);
    font-size:13px;outline:none;width:230px;box-shadow:var(--shadow);color:var(--ink);}
  .search input:focus{border-color:var(--c-web);}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.45;}
  .toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .tbtn{font-size:12px;border:1px solid var(--line);background:var(--paper2);border-radius:9px;padding:7px 12px;cursor:pointer;color:var(--soft);box-shadow:var(--shadow);}
  .tbtn:hover{border-color:var(--faint);color:var(--ink);}
  .tbtn.on{background:var(--ink);color:#fff;border-color:transparent;}
  .zoombar{margin-left:auto;display:flex;gap:6px;align-items:center;}
  .zbtn{width:32px;height:32px;border:1px solid var(--line);background:var(--paper2);border-radius:9px;cursor:pointer;
    font-size:15px;color:var(--soft);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;}
  .zbtn:hover{border-color:var(--faint);color:var(--ink);}

  /* ---------- canvas ---------- */
  #viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;}
  #viewport.grabbing{cursor:grabbing;}
  #canvas{position:absolute;top:0;left:0;transform-origin:0 0;}
  #edges{position:absolute;top:0;left:0;overflow:visible;pointer-events:none;}

  .mnode{position:absolute;display:flex;flex-direction:column;justify-content:center;
    border-radius:9px;border:1px solid var(--line);background:var(--paper2);
    padding:5px 11px;box-shadow:0 1px 2px rgba(30,36,48,.05);cursor:pointer;
    transition:box-shadow .15s,transform .12s,border-color .15s;user-select:none;white-space:nowrap;}
  .mnode .lb{font-size:13px;font-weight:600;line-height:1.25;}
  .mnode .lb .en{font-size:10.5px;font-weight:500;color:var(--faint);margin-left:6px;}
  .mnode .ds{font-size:10.5px;color:var(--faint);line-height:1.2;margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;}
  .mnode.root{background:var(--ink);border-color:var(--ink);color:#fff;padding:12px 20px;border-radius:13px;
    box-shadow:0 6px 22px -8px rgba(30,36,48,.5);}
  .mnode.root .lb{font-size:17px;}
  .mnode.root .lb .en{color:rgba(255,255,255,.6);}
  .mnode.root .ds{color:rgba(255,255,255,.68);}
  .mnode.branch{font-weight:700;color:#fff;border:none;}
  .mnode.branch .lb{font-size:13.5px;}
  .mnode.branch .ds{color:rgba(255,255,255,.8);}
  .mnode.leaf:hover,.mnode.branch:hover,.mnode.root:hover{transform:translateY(-1px);box-shadow:0 6px 18px -8px rgba(30,36,48,.4);}
  .mnode.sel{border-color:var(--ink)!important;box-shadow:0 0 0 2px rgba(30,36,48,.28),0 8px 20px -8px rgba(30,36,48,.45)!important;}
  .mnode.hit{box-shadow:0 0 0 2px #d23f2f,0 0 14px rgba(210,63,47,.4)!important;}
  .mnode.dim{opacity:.28;filter:saturate(.5);}
  .mnode .toggle{position:absolute;right:-9px;top:50%;transform:translateY(-50%);width:17px;height:17px;border-radius:50%;
    background:#fff;border:1px solid var(--line);color:var(--soft);font-size:11px;line-height:15px;text-align:center;
    cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .mnode .toggle:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
  .mnode.collapsed .toggle{background:var(--ink);color:#fff;border-color:var(--ink);}

  .edge{fill:none;stroke-width:1.6;stroke-linecap:round;opacity:.55;transition:opacity .15s,stroke-width .15s;}
  .edge.hot{opacity:1;stroke-width:2.6;}
  .edge.dim{opacity:.1;}
  .xlink{fill:none;stroke:#b3452f;stroke-width:1.5;stroke-dasharray:5 4;opacity:.62;transition:opacity .15s;}
  .xlink.hot{opacity:1;stroke-width:2.4;}
  .xlink.dim{opacity:.08;}
  .xlabel{font-size:10.5px;fill:#b3452f;font-weight:600;pointer-events:none;}

  /* ---------- legend ---------- */
  .legend{position:absolute;z-index:25;left:20px;bottom:18px;background:rgba(255,253,249,.94);border:1px solid var(--line);
    border-radius:12px;padding:10px 13px;box-shadow:var(--shadow);font-size:11.5px;color:var(--soft);max-width:330px;}
  .legend .row{display:flex;flex-wrap:wrap;gap:9px 13px;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  .legend .hint{margin-top:8px;color:var(--faint);line-height:1.55;}

  /* ---------- detail card ---------- */
  .card{position:absolute;z-index:25;right:20px;bottom:18px;width:330px;background:rgba(255,253,249,.97);
    border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:15px 16px;}
  .card .k{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;margin-bottom:6px;}
  .card h3{margin:0 0 4px;font-size:15.5px;}
  .card .path{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--soft);
    background:rgba(0,0,0,.045);border-radius:6px;padding:4px 8px;display:inline-block;margin:6px 0 9px;word-break:break-all;}
  .card .ds{font-size:12.5px;line-height:1.65;color:var(--soft);}
  .card .empty{font-size:12.5px;color:var(--faint);line-height:1.7;}
  footer.credit{position:absolute;z-index:25;left:50%;transform:translateX(-50%);bottom:6px;font-size:10.5px;color:var(--faint);}
</style>
</head>
<body>

<div class="bar">
  <div class="title">
    <span class="tag">砚舟 · 砚舟</span>
    <h1>框架思维导图</h1>
    <div class="sub">中心为项目，向外展开主线；虚线 = 跨模块关系。点击节点看详情，滚轮缩放、拖拽平移。</div>
  </div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="搜索节点…" autocomplete="off"/>
  </div>
  <div class="toggles">
    <span class="tbtn on" id="tRel">显示关系线</span>
    <span class="tbtn" id="tDesc">显示说明</span>
    <span class="tbtn" id="tExpand">展开全部</span>
    <span class="tbtn" id="tCollapse">仅看主线</span>
  </div>
  <div class="zoombar">
    <div class="zbtn" id="zOut">−</div>
    <div class="zbtn" id="zIn">＋</div>
    <div class="zbtn" id="zFit" title="适应窗口">⤢</div>
  </div>
</div>

<div id="viewport">
  <div id="canvas">
    <svg id="edges"></svg>
  </div>
</div>

<div class="legend" id="legend"></div>
<div class="card" id="card">
  <div class="empty">点击任意节点，查看它的路径与职责。<br/>虚线为跨模块关系（如 web→server、插件→宿主）。</div>
</div>
<footer class="credit">砚舟 框架思维导图 · 依据仓库实际结构生成</footer>

<script>

    { id:'shared-types', lb:'@novel/shared', en:'packages/shared', ds:'纯领域类型契约（无运行时依赖）：Project/Chapter/Character/… + 纯派生函数。', color:COL.data },
    { id:'persist', lb:'存储模型', en:'多库', ds:'主库 novelmuse.db + 每项目一库 projects/{id}.db。', color:COL.data }
  ]},

  /* ---- 6. 桌面交付 ---- */
  { id:'desktop', lb:'桌面交付', en:'apps/desktop', ds:'Electron 桌面壳（内嵌后端子进程；便携 zip / NSIS 安装包）。', color:COL.desktop, kids:[
    { id:'dt-main', lb:'主进程', en:'main.ts', ds:'单实例锁→布局/播种/联接→拉起 server→stderr 端口握手→/api/health 探针→开窗；9 个 IPC。', color:COL.desktop },
    { id:'dt-server', lb:'内嵌后端', en:'server-process.ts', ds:'spawn + 端口握手 + 健康探针 + 崩溃重启（3×/60s）+ stdin 优雅停止。', color:COL.desktop },
    { id:'dt-layout', lb:'载荷与播种', en:'paths.ts / payload', ds:'运行时布局、种子插件、data 联接、better-sqlite3 联接；build-stamp 指纹与重播种。', color:COL.desktop },

    { id:'arch', lb:'architecture/ ADR', en:'docs/architecture', ds:'plugin-standard · plugins-inventory · framework-tree · dock-protocol · desktop-packaging…', color:COL.docs },
    { id:'handover', lb:'handover/', en:'docs/handover', ds:'接手开发先读：AI 写作模块现状、未完成清单、已知陷阱。', color:COL.docs },
    { id:'ci', lb:'CI / Docker / 根脚本', en:'.github · Dockerfile · package.json', ds:'CI 质量门（Node 24：type-check→lint→test）；两阶段镜像；根脚本 dev/verify/e2e。', color:COL.docs }

/* 跨模块关系（虚线） */
const XRELS=[
  { from:'web', to:'server', label:'HTTP /api' },
  { from:'web-host', to:'core-contract', label:'契约' },
  { from:'srv-plugin', to:'core-contract', label:'契约' },
  { from:'plugins', to:'web-shell', label:'注册面板' },
  { from:'plugins', to:'srv-plugin', label:'apply(ctx)' },
  { from:'srv-services', to:'db', label:'Drizzle' },
  { from:'desktop', to:'server', label:'spawn 内嵌' },
  { from:'desktop', to:'web', label:'静态托管' },
  { from:'core-modes', to:'plugins', label:'按模式裁剪' },
  { from:'vf', to:'plugins', label:'门禁校验' }
];

/* ==========================================================
   布局（水平思维导图）
   ========================================================== */
const canvas=document.getElementById('canvas');
const svg=document.getElementById('edges');
const viewport=document.getElementById('viewport');
const cardEl=document.getElementById('card');
const qEl=document.getElementById('q');

const byId={};
(function index(n){ byId[n.id]=n; (n.kids||[]).forEach(index); })(ROOT);

const GAP=54, PADX=30, PADY=40;
let showDesc=false, showRel=true;

function measure(n){
  const fs = n.root?17 : n.branch?13.5 : 13;
  const label = n.lb + (n.en?'  '+n.en:'');
  let w=0;
  for(const ch of label) w += /[　-鿿＀-￯]/.test(ch) ? fs : fs*0.55;
  let max = n.root?260 : n.branch?210 : 200;
  let min = n.root?150 : 92;
  return Math.max(min, Math.min(max, w + 26));
}

function layout(){
  const levelMax=[];
  let cursor=0;
  const rowH = showDesc ? 60 : 40;   // 显示说明时行距加大，避免重叠
  function assign(n, depth){
    n._depth=depth;
    n._w=measure(n);
    levelMax[depth]=Math.max(levelMax[depth]||0, n._w);
    const kids = n._collapsed ? [] : (n.kids||[]);
    if(!kids.length){ n._y=cursor; cursor+=rowH; }
    else { kids.forEach(k=>assign(k, depth+1)); n._y=(kids[0]._y + kids[kids.length-1]._y)/2; }
  }
  assign(ROOT,0);

  const xs=[]; let x=PADX;
  for(let d=0; d<levelMax.length; d++){ xs[d]=x; x += levelMax[d] + GAP; }
  const totalW = x - GAP + PADX;

  const nodes=[];
  (function place(n){
    n._x=xs[n._depth];
    nodes.push(n);
    (n._collapsed?[]:(n.kids||[])).forEach(place);
  })(ROOT);

  const totalH = cursor + PADY*2;
  // 居中：把 root 放到垂直中心
  const yShift = (totalH/2) - ROOT._y;
  nodes.forEach(n=>{ n._y += yShift; });

  return {nodes, totalW, totalH};
}

/* ==========================================================
   渲染
   ========================================================== */
let nodeEls={}, edgeEls=[], xEls=[];
let currentSel=null;

function render(){
  // 清空（保留 svg）
  [...canvas.querySelectorAll('.mnode')].forEach(e=>e.remove());
  svg.innerHTML=''; svg.style.width='0'; svg.style.height='0';
  nodeEls={}; edgeEls=[]; xEls=[];

  const {nodes,totalW,totalH}=layout();
  canvas.style.width=totalW+'px';
  canvas.style.height=totalH+'px';
  svg.setAttribute('width',totalW); svg.setAttribute('height',totalH);
  svg.style.width=totalW+'px'; svg.style.height=totalH+'px';

  // 先建节点 DOM
  nodes.forEach(n=>{
    const el=document.createElement('div');
    el.className='mnode'+(n.root?' root':'')+(n.branch?' branch':'')+(n._collapsed?' collapsed':'');
    if(n.root){ el.style.left=n._x+'px'; }
    else if(n.branch){ el.style.background=n.color; }
    else { el.style.borderLeft='3px solid '+n.color; }
    el.style.left=n._x+'px';
    const approxH = showDesc?56:34;
    el.style.top=(n._y-approxH/2)+'px';
    el.style.width=n._w+'px';
    el.dataset.id=n.id;
    const lb=document.createElement('div'); lb.className='lb';
    lb.textContent=n.lb;
    if(n.en){ const s=document.createElement('span'); s.className='en'; s.textContent=n.en; lb.appendChild(s); }
    el.appendChild(lb);
    if(n.ds && (showDesc||n.branch||n.root)){
      const ds=document.createElement('div'); ds.className='ds'; ds.textContent=n.ds; el.appendChild(ds);
      el.style.height='auto';
    } else { el.style.height='32px'; }
    if((n.kids&&n.kids.length)){
      const t=document.createElement('div'); t.className='toggle'; t.textContent=n._collapsed?'+':'−';
      t.addEventListener('click',e=>{ e.stopPropagation(); n._collapsed=!n._collapsed; render(); });
      el.appendChild(t);
    }
    el.addEventListener('click',e=>{ e.stopPropagation(); select(n); });
    el.addEventListener('mouseenter',()=>hover(n,true));
    el.addEventListener('mouseleave',()=>hover(n,false));
    canvas.appendChild(el);
    nodeEls[n.id]=el;
  });

  // 分支色连线：parent -> child
  nodes.forEach(n=>{
    (n._collapsed?[]:(n.kids||[])).forEach(k=>{
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      const px=n._x+n._w, py=n._y, cx=k._x, cy=k._y;
      const dx=(cx-px)*0.5;
      path.setAttribute('d',`M ${px} ${py} C ${px+dx} ${py}, ${cx-dx} ${cy}, ${cx} ${cy}`);
      path.setAttribute('stroke',k.color);
      path.setAttribute('class','edge');
      path.dataset.from=n.id; path.dataset.to=k.id;
      svg.appendChild(path); edgeEls.push(path);
    });
  });

  // 跨模块关系
  drawXrels();

  // 恢复选中
  if(currentSel && byId[currentSel]) select(byId[currentSel], true);
  applySearch();
}

function anchor(a, side){
  const el=nodeEls[a.id]; if(!el) return null;
  const w=el.offsetWidth||a._w, h=el.offsetHeight||32;
  if(side==='r') return {x:a._x+w, y:a._y, w,h};
  if(side==='l') return {x:a._x, y:a._y, w,h};
  return {x:a._x+w/2, y:a._y, w,h};
}

function drawXrels(){
  if(!showRel) return;
  XRELS.forEach(r=>{
    const a=byId[r.from], b=byId[r.to];
    if(!a||!b||!nodeEls[a.id]||!nodeEls[b.id]) return;
    // 选较短路径方向
    let pa,pb;
    if(a._x <= b._x){ pa=anchor(a,'r'); pb=anchor(b,'l'); }
    else { pa=anchor(a,'l'); pb=anchor(b,'r'); }
    const dx=Math.max(40, Math.abs(pb.x-pa.x)*0.45);
    const c1x = pa.x < pb.x ? pa.x+dx : pa.x-dx;
    const c2x = pa.x < pb.x ? pb.x-dx : pb.x+dx;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${pa.x} ${pa.y} C ${c1x} ${pa.y}, ${c2x} ${pb.y}, ${pb.x} ${pb.y}`);
    path.setAttribute('class','xlink');
    path.dataset.from=a.id; path.dataset.to=b.id;
    svg.appendChild(path); xEls.push(path);
    // 标签
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('class','xlabel');
    t.setAttribute('x',(pa.x+pb.x)/2);
    t.setAttribute('y',(pa.y+pb.y)/2 - 4);
    t.setAttribute('text-anchor','middle');
    t.textContent=r.label;
    svg.appendChild(t); xEls.push(t);
  });
}

/* ==========================================================
   选择 / 悬停
   ========================================================== */
function ancestors(n){ const out=[]; let c=n; while(c){ out.push(c.id); c=c._parent; } return out; }
(function setParent(n){ (n.kids||[]).forEach(k=>{ k._parent=n; setParent(k); }); })(ROOT);

function select(n, silent){
  currentSel=n.id;
  Object.values(nodeEls).forEach(e=>e.classList.remove('sel'));
  if(nodeEls[n.id]) nodeEls[n.id].classList.add('sel');
  // 高亮 root→n 路径的边
  const chain=new Set(ancestors(n));
  edgeEls.forEach(p=>{
    const hot = chain.has(p.dataset.to) && chain.has(p.dataset.from);
    p.classList.toggle('hot',hot);
    p.classList.toggle('dim', !hot);
  });
  xEls.forEach(p=>p.classList.add('dim'));
  showCard(n);
  if(!silent) focusNode(n);
}

function focusNode(n){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  const el=nodeEls[n.id]; if(!el) return;
  const w=el.offsetWidth||n._w, h=el.offsetHeight||32;
  const cx=n._x + w/2, cy=n._y;
  // 保持缩放，仅平移使节点居中
  tx = vw/2 - cx*scale;
  ty = vh/2 - cy*scale;
  applyTransform();
}

function hover(n,on){
  if(!on){
    edgeEls.forEach(p=>p.classList.remove('hot'));
    return;
  }
  const sub=new Set(); (function walk(x){ sub.add(x.id); (x.kids||[]).forEach(walk); })(n);
  edgeEls.forEach(p=>{
    if(sub.has(p.dataset.from) && sub.has(p.dataset.to)) p.classList.add('hot');
  });
}

function showCard(n){
  const kind = n.root?'根节点' : n.branch?'主线' : '模块';
  cardEl.innerHTML=
    `<div class="k" style="color:${n.color}">${kind}</div>`+
    `<h3>${esc(n.lb)}</h3>`+
    (n.en?`<div class="path">${esc(n.en)}</div>`:'')+
    (n.ds?`<div class="ds">${esc(n.ds)}</div>`:'');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ==========================================================
   搜索
   ========================================================== */
let query='';
function applySearch(){
  const q=query.trim().toLowerCase();
  Object.entries(nodeEls).forEach(([id,el])=>{
    const n=byId[id];
    el.classList.remove('hit','dim');
    if(!q) return;
    const hay=(n.lb+' '+(n.en||'')+' '+(n.ds||'')).toLowerCase();
    if(hay.includes(q)) el.classList.add('hit');
    else el.classList.add('dim');
  });
}
qEl.addEventListener('input',e=>{ query=e.target.value; applySearch(); });

/* ==========================================================
   视图变换（缩放 / 平移 / 适应）
   ========================================================== */
let scale=1, tx=0, ty=0;
function applyTransform(){
  canvas.style.transform=`translate(${tx}px, ${ty}px) scale(${scale})`;
}
function fit(){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  const cw=parseFloat(canvas.style.width)||1000, ch=parseFloat(canvas.style.height)||800;
  scale=Math.min((vw-60)/cw,(vh-140)/ch,1.15);
  scale=Math.max(0.2,scale);
  tx=(vw-cw*scale)/2; ty=(vh-ch*scale)/2 + 20;
  applyTransform();
}
document.getElementById('zIn').addEventListener('click',()=>{ scale=Math.min(2.5,scale*1.15); applyTransform(); });
document.getElementById('zOut').addEventListener('click',()=>{ scale=Math.max(0.2,scale/1.15); applyTransform(); });
document.getElementById('zFit').addEventListener('click',fit);

viewport.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=viewport.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const factor=e.deltaY<0?1.1:1/1.1;
  const ns=Math.max(0.2,Math.min(2.5,scale*factor));
  tx = mx - (mx-tx)*(ns/scale);
  ty = my - (my-ty)*(ns/scale);
  scale=ns; applyTransform();
},{passive:false});

let dragging=false, sx=0, sy=0, ox=0, oy=0;
viewport.addEventListener('mousedown',e=>{
  if(e.target.closest('.mnode')) return;
  dragging=true; sx=e.clientX; sy=e.clientY; ox=tx; oy=ty; viewport.classList.add('grabbing');
});
window.addEventListener('mousemove',e=>{
  if(!dragging) return;
  tx=ox+(e.clientX-sx); ty=oy+(e.clientY-sy); applyTransform();
});
window.addEventListener('mouseup',()=>{ dragging=false; viewport.classList.remove('grabbing'); });

/* ==========================================================
   开关
   ========================================================== */
document.getElementById('tRel').addEventListener('click',e=>{
  showRel=!showRel; e.target.classList.toggle('on',showRel); render();
});
document.getElementById('tDesc').addEventListener('click',e=>{
  showDesc=!showDesc; e.target.classList.toggle('on',showDesc); render();
});
document.getElementById('tExpand').addEventListener('click',()=>{
  Object.values(byId).forEach(n=>n._collapsed=false); render(); fit();
});
document.getElementById('tCollapse').addEventListener('click',()=>{
  Object.values(byId).forEach(n=>{ if(n._depth>=1 && n.kids&&n.kids.length) n._collapsed=true; }); render(); fit();
});

/* ==========================================================
   图例
   ========================================================== */
(function legend(){
  const items=ROOT.kids.map(k=>`<span><i style="background:${k.color}"></i>${k.lb}</span>`).join('');
  document.getElementById('legend').innerHTML=
    `<div class="row">${items}</div>`+
    `<div class="hint">滚轮缩放 · 拖拽平移 · 点击节点高亮其路径 · 虚线为跨模块关系。圆点 <b>−</b>/<b>+</b> 折叠分支。</div>`;
})();

/* ==========================================================
   启动
   ========================================================== */
render();
fit();
// 默认折叠第三层，避免过密
Object.values(byId).forEach(n=>{ if(n._depth>=2 && n.kids&&n.kids.length) n._collapsed=true; });
render(); fit();
</script>
</body>
</html>
